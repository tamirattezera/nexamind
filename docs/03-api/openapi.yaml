openapi: 3.1.0

info:
  title: NexaMind API
  version: 1.0.0
  description: |
    Initial REST API specification for NexaMind AI Chat.
    NexaMind provides authenticated users with conversation management
    and AI-powered messaging through a backend-managed Gemini integration.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

tags:
  - name: Authentication
    description: User registration and authentication
  - name: Users
    description: Authenticated user profile
  - name: Conversations
    description: Conversation management
  - name: Messages
    description: Conversation message history and AI generation

security:
  - BearerAuth: []

paths:
  /auth/register/:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: >
        Create a new NexaMind account using an email address and password.
        Password confirmation is required and is not returned.
      security: []
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/login/:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate a user and obtain JWT credentials.
      security: []
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Request validation failed. Field-keyed validation errors are returned. Malformed requests do not count toward login throttling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginValidationError"
        "401":
          description: Invalid credentials. Unknown email and incorrect password produce the same response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRFDetailError"
        "429":
          description: Login cooldown is active after five failed credential attempts within the 15-minute failure window.
          headers:
            Retry-After:
              description: Remaining cooldown duration in seconds.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRFDetailError"
        "503":
          description: Login protection cache is unavailable. Authentication fails closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRFDetailError"

  /auth/token/refresh/:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Access token refreshed and refresh token rotated; the submitted refresh token is blacklisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Request validation failed. Field-keyed serializer errors are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginValidationError"
        "401":
          description: Invalid, expired, or blacklisted refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRFDetailError"

  /auth/token/verify/:
    post:
      tags:
        - Authentication
      summary: Verify token
      description: >
        Validate a token's signature, expiration, and blacklist status.
        This endpoint does not verify the token type or establish that the
        token is suitable for a particular authentication purpose.
      security: []
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenVerifyRequest"
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
                additionalProperties: false
        "400":
          description: Request validation failed. Field-keyed serializer errors are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginValidationError"
        "401":
          description: Invalid, expired, or blacklisted token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRFDetailError"

  /auth/me/:
    get:
      tags:
        - Users
      summary: Retrieve current user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /conversations/:
    get:
      tags:
        - Conversations
      summary: List conversations
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Conversations
      summary: Create conversation
      operationId: createConversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /conversations/{conversation_id}/:
    parameters:
      - $ref: "#/components/parameters/ConversationId"

    get:
      tags:
        - Conversations
      summary: Retrieve conversation
      operationId: retrieveConversation
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Conversations
      summary: Update conversation
      operationId: updateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Conversations
      summary: Delete conversation
      operationId: deleteConversation
      responses:
        "204":
          description: Conversation deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{conversation_id}/messages/:
    parameters:
      - $ref: "#/components/parameters/ConversationId"

    get:
      tags:
        - Messages
      summary: List conversation messages
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated chronological message history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Messages
      summary: Send message and generate AI response
      description: |
        Submit user content to a conversation. Every new generation
        submission requires a UUID v4 Idempotency-Key header.

        A completed replay with the same key and identical normalized
        content returns the original response. An in-progress replay
        returns 202 and creates no additional Message or ChatTurn.
        Reusing a key with different normalized content returns 409.

        Context preflight occurs before Transaction A. Preflight failures
        create neither a user Message nor a ChatTurn and do not reserve
        the idempotency key. CHAT_CONTEXT_LIMIT_EXCEEDED maps to 400;
        CHAT_CONTEXT_UNAVAILABLE maps to 503.

        After Transaction A commits, a generation or subsequent
        processing failure preserves the user Message and transitions
        the existing ChatTurn to FAILED. A failed replay returns the
        same mapped HTTP status as its recorded failure.

        The backend controls ownership, context construction, provider
        communication, stored message roles, and generation metadata.
        Provider calls occur outside database transactions and row locks.
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: New generation completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "200":
          description: Idempotent replay of a completed generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "202":
          description: Matching generation submission is still processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingResponse"
        "400":
          description: Invalid message, idempotency key, or mandatory context budget exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict caused by either an idempotency key reused with different normalized content (IDEMPOTENCY_KEY_REUSED) or a distinct submission while another turn is in progress in the conversation (CHAT_TURN_ALREADY_IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Application rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AI provider failure or unusable provider response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Required conversation context is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: >-
            AI_PROVIDER_TIMEOUT indicates the AI provider request timed out.
            CHAT_TURN_PROCESSING_TIMEOUT indicates a ChatTurn exceeded
            the stale-processing threshold and was recovered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token.

  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: UUID of the conversation.
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        UUID v4 identifying a generation submission. Reuse the same key
        and identical request content when retrying an in-progress or
        completed submission.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - password_confirm
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: >
            Must be 8–128 characters and pass the configured Django password
            validators, including user-attribute similarity, common-password,
            and numeric-password checks. Leading and trailing whitespace is
            preserved.
          minLength: 8
          maxLength: 128
        password_confirm:
          type: string
          format: password
          description: >
            Must exactly match the password. Leading and trailing whitespace
            is preserved.
          minLength: 8
          maxLength: 128

    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      required:
        - access
        - refresh
      properties:
        access:
          type: string
        refresh:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refresh
      properties:
        refresh:
          type: string

    TokenVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string

    User:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true

    ConversationCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        custom_instructions:
          type:
            - string
            - "null"

    ConversationUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 255
        custom_instructions:
          type:
            - string
            - "null"

    Conversation:
      type: object
      required:
        - id
        - title
        - custom_instructions
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        custom_instructions:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationSummary:
      type: object
      required:
        - id
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      required:
        - id
        - role
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        model:
          type:
            - string
            - "null"
        usage:
          oneOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
        created_at:
          type: string
          format: date-time

    Usage:
      type: object
      properties:
        input_tokens:
          type:
            - integer
            - "null"
        output_tokens:
          type:
            - integer
            - "null"
        total_tokens:
          type:
            - integer
            - "null"

    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: User message content. Whitespace-only values are rejected by backend validation.

    SendMessageResponse:
      type: object
      required:
        - user_message
        - assistant_message
      properties:
        user_message:
          $ref: "#/components/schemas/Message"
        assistant_message:
          $ref: "#/components/schemas/Message"

    ProcessingResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: processing
        message:
          type: string
          const: This request is still being processed. Retry the same request with the same Idempotency-Key.

    ConversationList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
        next:
          type:
            - string
            - "null"
          format: uri
        previous:
          type:
            - string
            - "null"
          format: uri
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"

    MessageList:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
        next:
          type:
            - string
            - "null"
          format: uri
        previous:
          type:
            - string
            - "null"
          format: uri
        results:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    LoginValidationError:
      type: object
      description: Field names map to arrays of validation messages.
      additionalProperties:
        type: array
        items:
          type: string

    DRFDetailError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication is required or the credential is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource does not exist or is not accessible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
